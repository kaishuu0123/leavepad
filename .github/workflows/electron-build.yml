name: Electron App Build/release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      os:
        description: "Target OS"
        required: true
        default: "macos-latest"
        type: choice
        options:
          - macos-latest
          - ubuntu-latest
          - windows-latest

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', inputs.os)) || fromJson('["macos-latest", "ubuntu-latest", "windows-latest"]') }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install
      - name: Build Windows
        if: ${{ matrix.os == 'windows-latest'}}
        run: |
          pnpm build:win
      - name: Import Apple installer signing certificate
        if: ${{ matrix.os == 'macos-latest'}}
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEV_ID_APP }}
          p12-password: ${{ secrets.APPLE_DEV_ID_APP_PASS }}
      - name: Build macOS
        if: ${{ matrix.os == 'macos-latest'}}
        run: |
          xattr -cr .
          pnpm build:mac
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Build Linux
        if: ${{ matrix.os == 'ubuntu-latest'}}
        run: |
          sudo snap install snapcraft --classic
          pnpm build:linux
      - name: Upload artifacts (manual build)
        uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: leavepad-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.exe
            dist/*.snap
            dist/*.AppImage
      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.zip
            dist/*.dmg
            dist/*.exe
            dist/*.snap
            dist/*.AppImage
            dist/latest.yml
            dist/latest-mac.yml
            dist/latest-linux.yml
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
